# .NET / Unity 反 REA 选项的机器可读清单（供 Agent 在 P1 方案里组装"菜单"）
#
# 用法：Agent 读取本文件 → 按项目画像（是否联网 / 发布形态 / 是否 Unity / 能否改构建 / 价值等级）
#       筛出 1–3 个候选 → 把 principle / pros / cons / impacts 摘要写进 out/PROPOSAL.md
#       → 由用户选择（SKILL.md 工作流 P1→P2）。
#
# 边界：本技能不分发这里的任何第三方工具；source 字段只是"获取途径"记录。
# 人类可读版（含说明与场景匹配）：docs/dotnet-anti-rea.md

version: 1
kind: dotnet-anti-rea-options
status: guide-only  # 非需求基线，不改变 SRS
note: >-
  .NET（C#/F#/VB）无 IL 层变换（ADR-006）。本清单按"攻击方要多付出什么"从高到低排列；
  效果量级是经验排序，不是承诺指标。单层混淆易被 de4dot 类工具还原，必须组合 + 下沉 native/AOT。

# 组合建议（按场景）
combinations:
  - scenario: 内部工具 / 低价值
    options: [D1]
  - scenario: 商用小工具、本就要联网
    options: [D0, D1]
  - scenario: 商用离线桌面 / CLI
    options: [D1, D2, D5]
  - scenario: 高价值离线产品
    options: [D6, D5, D7, D8]
  - scenario: Unity（Mono）
    options: [D1, D2, D5]
  - scenario: Unity（IL2CPP）
    options: [D1, D7]
    notes: IL2CPP 本身即"换赛道"；可用本技能加固生成的 C++（实验性，先小范围试点）
  - scenario: 预算充足、需最强
    options: [D0, D6, D4, D7, D8]

options:
  - id: D0
    name: 核心逻辑上服务端
    principle: 授权/密钥运算/核心算法放服务端 API（REST/gRPC/自定义），客户端只留调用与展示。
    effect: 攻击方逆到底只能拿到协议调用，无法获得核心资产。
    effectiveness: highest
    pros:
      - 唯一能让"逆到底也没有产出"的路径
      - 不受 CLR/元数据约束
      - 密钥不进客户端
    cons:
      - 需联网；有延迟与服务端容量成本
      - 离线软件、嵌入式、内网隔离环境不可用
    impacts:
      architecture: 最大（常需重写模块边界）
      runtime: 网络往返延迟
      ops: 可用性/SLA 成为新的失败点
      portability: 不变（客户端变薄）
    tools: []
    best_for: 产品本就要联网、核心价值可服务化（订阅/在线激活/云端推理）
    verify: 攻击方视角确认"逆到底得到什么"

  - id: D1
    name: 裁剪 + 名称混淆（基线）
    principle: PublishTrimmed 删除未引用代码；命名空间/类型/方法/字段重命名为无意义短名；不带 PDB。
    effect: 失去"名字即文档"的锚点，需靠数据流/调用图重建语义；反编译仍成功。
    effectiveness: low
    pros:
      - 开源/低成本，零或低许可成本
      - 顺带减小体积、加快加载
      - 所有 .NET 项目的第一步
    cons:
      - 单层对 REA 通常小时级可读通
      - 需维护 keep 规则（反射/序列化/DI/XAML/EF/PInvoke/Unity）
      - 去 PDB 后线上排障变难
    impacts:
      build: 需引入混淆器 task 与裁剪配置
      runtime: 基本无额外开销
      ops: mapping 必须归档；崩溃栈需还原
      portability: 不变
    tools:
      - name: Obfuscar
        source: https://github.com/obfuscar/obfuscar
        license: MIT
        note: XML 规则；轻量，适合先跑通回归与 mapping 归档
      - name: ConfuserEx（社区维护分支）
        source: https://github.com/mkaring/ConfuserEx
        license: MIT
        note: rename/constants/ctrl flow/anti-debug/packer 模块化
      - name: Dotfuscator
        source: https://www.preemptive.com/products/dotfuscator/
        license: commercial (Community edition limited)
        note: MSBuild/CI 集成
      - name: Eazfuscator.NET
        source: https://www.gapotchenko.com/eazfuscator.net
        license: commercial
        note: 重命名/字符串/常量/资源/防篡改
    best_for: 所有 .NET 项目的第一步
    verify: ilspycmd 反编译后统计命名可读率；确认公共 API 保留

  - id: D2
    name: 字符串/常数加密 + 控制流混淆
    principle: 字面量与数值常量运行期解密；分支/循环改写为不透明谓词、平坦化、代理调用等结构。
    effect: strings/常量锚点失效；反编译出现非法 goto/缺块；攻击方转读 IL + 动态观察。
    effectiveness: medium
    pros:
      - 不动架构，可按程序集/类型/方法粒度启用
      - 对"LLM 读反编译文本"这条最省力路径打击最明显
    cons:
      - de4dot 类工具能还原部分常见模式，单层很脆弱
      - 反编译失败不等于不可解（可换工具/调试/hook）
      - 与反射、序列化、XAML、资源名、ILMerge/单文件发布需适配
    impacts:
      build: 混淆器配置与回归成本
      runtime: 启动解密 + 运行期膨胀（通常可控，需 A/B）
      ops: 调试与栈可读性下降
      portability: 不变
    tools:
      - name: ConfuserEx（constants / ctrl flow）
        source: https://github.com/mkaring/ConfuserEx
        license: MIT
        note: 开源基线；强度有限，需组合
      - name: .NET Reactor
        source: https://www.eziriz.com/dotnet_reactor.htm
        license: commercial
        note: 字符串/常量/控制流/虚拟化/加壳
      - name: Agile.NET
        source: https://www.secureteam.net/
        license: commercial
        note: 混淆 + 虚拟化 + 防护
      - name: Babel Obfuscator
        source: https://www.babelfor.net/
        license: commercial
        note: 字符串加密/流混淆/虚拟化
    best_for: 只对 P0/P1 资产（授权/算法/协议/密钥派生）启用
    verify: ilspycmd + dnSpyEx + de4dot 三连；统计字符串明文比例与去混淆恢复率

  - id: D3
    name: 程序集加密/打包 + AssemblyResolve（加壳）
    principle: 程序集/资源加密，运行期由 native stub 或托管 Loader 解密到内存，经 Assembly.Load/AssemblyResolve/自定义 ALC 加载。
    effect: 静态没有可读 IL，攻击方必须运行期 dump。
    effectiveness: medium-high
    pros:
      - 静态强度显著高于 D1/D2
      - 对"直接 ilspycmd"这类低成本攻击有效
    cons:
      - 只抬高静态成本，必须配合 D7
      - 杀软对 packer 敏感（误报）
      - 与 NativeAOT/单文件/R2R、插件热加载、依赖注入扫描可能冲突
    impacts:
      build: 需要加壳步骤与签名顺序调整
      runtime: 启动解密与校验开销
      ops: 排障困难；需保留无壳降级路径
      portability: 不变
    tools:
      - name: .NET Reactor（NecroBit）
        source: https://www.eziriz.com/dotnet_reactor.htm
        license: commercial
        note: 加壳/加密/反调试
      - name: Themida / WinLicense（.NET）
        source: https://www.oreans.com/
        license: commercial
        note: 原生壳；注意杀软误报与兼容性
      - name: 自研 AssemblyLoadContext
        source: https://learn.microsoft.com/dotnet/core/dependency-loading/understanding-assemblyloadcontext
        license: n/a
        note: 可控但需自行实现完整性校验与降级
    best_for: 有明确"防静态抄源码"诉求且能接受启动/兼容性代价
    verify: 内存 dump / hook Assembly.Load 的成本；静态 strings/IL 可见性

  - id: D4
    name: IL 虚拟化（VMP 类）
    principle: 敏感方法编译为自定义指令集 + 内嵌解释器，CLR 只执行解释器；原方法体不再是标准 IL。
    effect: 攻击方必须逆解释器、重建 ISA 才能恢复语义——把"读源码"变成"写反编译器"。
    effectiveness: highest-on-il
    pros:
      - IL 层单点成本最高
      - 与 D2/D3 叠加形成纵深
    cons:
      - 工具稀缺、商用许可
      - 与 async/iterator、泛型、反射、异常、调试兼容性复杂
      - 对新 .NET 版本支持可能滞后
    impacts:
      build: 工具/版本适配成本
      runtime: 几十倍至两个数量级（解释执行）
      ops: 异常栈与调试信息失真
      portability: 不变
    tools:
      - name: .NET Reactor（虚拟化）
        source: https://www.eziriz.com/dotnet_reactor.htm
        license: commercial
      - name: Agile.NET
        source: https://www.secureteam.net/
        license: commercial
      - name: VMProtect（.NET）
        source: https://vmpsoft.com/
        license: commercial
      - name: 自研 VM + IL 重写
        source: n/a
        license: n/a
        note: 门槛高；学术与开源实现多已停更，仅作参考
    best_for: 只挑 2–5 个最敏感方法
    verify: 反编译失败率 + 动态恢复工时 + 性能 A/B

  - id: D5
    name: 下沉 native（P/Invoke / C++/CLI / 函数指针）
    principle: 敏感核心用 C/C++ 实现为原生库，托管侧只做调用；原生二进制回到 LLVM 战场，可用本技能加固。
    effect: 防护强度跳到 native 量级；IL 里只剩调用桩与封送代码。
    effectiveness: high
    pros:
      - 核心逻辑不再以 IL 形式存在
      - 计算密集段常更快
      - 与 D6 可叠加
    cons:
      - 每平台/架构各编一份
      - 跨语言调试困难；封送/内存管理易错
      - native 崩溃直接杀掉进程；AOT/裁剪需保留互操作元数据
    impacts:
      architecture: 需要模块边界设计（批量化调用）
      build: 构建矩阵与产物分发增加
      runtime: 封送开销（批量化后可忽略）
      portability: 产物层丧失
    tools:
      - name: P/Invoke（DllImport / LibraryImport）
        source: https://learn.microsoft.com/dotnet/standard/native-interop/pinvoke
        license: n/a
        note: LibraryImport 源生成器（.NET 7+）可减少运行期封送
      - name: NativeLibrary
        source: https://learn.microsoft.com/dotnet/api/system.runtime.interopservices.nativelibrary
        license: n/a
        note: 跨平台动态加载 + 函数指针
      - name: C++/CLI
        source: https://learn.microsoft.com/cpp/dotnet/dotnet-programming-with-cpp-cli-visual-cpp
        license: n/a
        note: Windows-only，混合模式程序集
    best_for: 加密/授权/协议等核心热路径
    verify: 用本技能 verify/attack_sim 验证 native 侧；托管侧只检查是否残留算法

  - id: D6
    name: NativeAOT / Mono AOT（整体 AOT）
    principle: 构建期把整个应用 AOT 编译为原生可执行文件，IL 与元数据不再是可执行内容。
    effect: REA 从"反编译 .NET"退回"逆原生二进制"，并失去 CIL 符号/常量锚点。
    effectiveness: high
    pros:
      - 一次到位（整应用换赛道）
      - 启动快、内存低、可无运行时分发
      - 可继续用本技能加固
    cons:
      - 闭世界：反射/Reflection.Emit/动态加载受限
      - 逐 RID 产物；构建时间明显变长
      - 部分库/框架不兼容；调试诊断受限
    impacts:
      build: CI 变慢，需源生成器/rd.xml 改造
      runtime: 启动更好，稳态需实测
      ops: 发布矩阵 ×N；行为差异需回归
      portability: 产物层丧失
    tools:
      - name: NativeAOT
        source: https://learn.microsoft.com/dotnet/core/deploying/native-aot/
        license: MIT (.NET runtime)
        note: dotnet publish -r <rid> -p:PublishAot=true（.NET 7+）
      - name: Mono 全 AOT
        source: https://www.mono-project.com/docs/advanced/aot/
        license: MIT/LGPL 组合
        note: iOS/Android/主机平台的常见形态
    best_for: CLI/桌面/服务（不依赖运行期动态代码）
    verify: 本技能对 NativeAOT 产物做 strings/nm/反编译核验 + verify/attack_sim

  - id: D7
    name: 运行期对抗（反调试 / 防篡改 / 完整性）
    principle: 检测调试器/Profiler/注入/补丁/虚拟化，校验自身哈希与签名，异常时降级或拒绝继续。
    effect: 抬高动态 dump、单步跟踪、脚本化批量攻击的成本（与 D3/D4 协同最关键）。
    effectiveness: supporting
    pros:
      - 与静态混淆正交、可叠加
      - 把便宜分析变成要花人力的分析
    cons:
      - 不阻止静态分析
      - 误报伤合法用户/调试/无障碍工具
      - 检测逻辑可被 patch；可能触发杀软/商店审核
    impacts:
      build: 需要签名/哈希基线
      runtime: 启动/运行检测开销
      ops: 误杀救济通道与支持成本
      portability: 需逐平台适配
    tools:
      - name: .NET Reactor / Eazfuscator / Agile.NET / Dotfuscator Pro（防篡改）
        source: 各厂商官网（见 D1/D2）
        license: commercial
      - name: 自研检测
        source: https://learn.microsoft.com/dotnet/api/system.diagnostics.debugger.isattached
        license: n/a
        note: Debugger.IsAttached / IsDebuggerPresent / 哈希自校验
    best_for: 与 D3/D4 叠加使用
    verify: 动态分析成本（挂调试器/内存 dump 的成功率与耗时）

  - id: D8
    name: 密钥与信任根 + 水印
    principle: 密钥不进客户端（服务端签发/HSM/KMS/平台安全存储）；水印用于溯源。
    effect: 代码被逆也拿不到可用密钥；泄露可追踪。
    effectiveness: supporting
    pros:
      - 让攻击产出不可直接用
      - 水印为维权留证
    cons:
      - 需服务端/硬件能力；离线受限
      - DPAPI 绑定用户/机器，多端体验需设计
      - 白盒密码不是银弹
    impacts:
      architecture: 密钥生命周期与轮换
      ops: 托管/合规成本
      portability: 依赖平台能力
    tools:
      - name: Windows DPAPI
        source: https://learn.microsoft.com/windows/win32/seccng/cng-dpapi
        license: n/a
      - name: Apple Keychain / Secure Enclave
        source: https://developer.apple.com/documentation/security/keychain_services
        license: n/a
      - name: Android Keystore / StrongBox
        source: https://developer.android.com/privacy-and-security/keystore
        license: n/a
      - name: HSM / KMS
        source: 各云厂商或硬件厂商
        license: commercial
    best_for: 只要还发密钥到客户端，就应优先处理
    verify: 客户端是否残留可用密钥/明文许可证

# Unity / IL2CPP 特别路径（不属于单一选项，而是"构建形态 + 组合"）
unity:
  mono:
    attack_surface: Assembly-CSharp.dll 可被 dnSpy/ILSpy 直接还原
    recommendation: [D1, D2, D5]
    notes: 托管裁剪 + link.xml；核心逻辑下沉 native
  il2cpp:
    attack_surface: 原生二进制 + global-metadata.dat；Il2CppDumper 可恢复类型/方法名
    recommendation: [IL2CPP, "本技能加固生成的 C++", D7]
    notes: >-
      IL2CPP 本身即"换赛道"。可尝试用本技能构建注入（clang + 插件）加固生成的 C++，
      按源文件/符号收窄范围；属实验性路径，需在你的 Unity 版本上先做小范围试点。
  webgl:
    attack_surface: 可下载的 IL2CPP/WASM 产物，前端逆向门槛低
    recommendation: [D0]
    notes: 服务端化优先；WASM 层只能抬门槛

# 验证方法论（托管侧）
verification:
  note: >-
    本技能 verify/attack_sim 面向 LLVM 原生产物，不适用于 CIL 托管程序集；
    托管侧用反编译器 + 去混淆器按本文方法论执行，D5/D6/IL2CPP 的 native 部分回到本技能链路。
  tools:
    - name: ILSpy / ilspycmd
      source: https://github.com/icsharpcode/ILSpy
      license: MIT
      use: 程序集 → C# 工程（ilspycmd -p -o out A.dll）
    - name: dnSpyEx
      source: https://github.com/dnSpyEx/dnSpy
      license: GPLv3
      use: 反编译 + 调试 + 内存查看
    - name: dotPeek
      source: https://www.jetbrains.com/decompiler/
      license: freeware
      use: 备选反编译器（交叉验证）
    - name: de4dot
      source: https://github.com/de4dot/de4dot
      license: GPLv3
      use: 去混淆，检验 D1/D2 的实际强度
    - name: ildasm / monodis
      source: .NET SDK / Mono
      license: 随 SDK
      use: IL 级交叉核对
    - name: Il2CppDumper
      source: https://github.com/Perfare/Il2CppDumper
      license: MIT
      use: IL2CPP 元数据恢复（类型/方法名）
    - name: objdump / nm / strings
      source: 系统 binutils
      license: GPL
      use: NativeAOT / IL2CPP / D5 原生产物静态核验
  metrics:
    - 命名可读率（类型/方法/字段）
    - 字符串明文比例
    - 反编译失败/异常率
    - 去混淆后恢复率（de4dot）
    - 重建可编译工程的成功率与工时
    - "逆到底得到了什么（可用算法/密钥 = 防护不够）"
  steps:
    - 用 2–3 个反编译器交叉验证，并跑一次 de4dot
    - 统计上述指标
    - 尝试重建工程并计时
    - 原生产物（D5/D6/IL2CPP）改用 strings/nm/objdump + 本技能 verify/attack_sim

# WebAssembly（WASM）反 REA 选项的机器可读清单（供 Agent 在 P1 方案里组装"菜单"）
#
# 用法：Agent 读取本文件 → 按项目画像（源语言/运行时/宿主/服务端/能否改构建）
#       筛出 1–3 个候选 → 把 principle / pros / cons / impacts 摘要写进 out/PROPOSAL.md
#       → 由用户选择（SKILL.md 工作流 P1→P2）。
#
# 边界：本技能不分发这里的任何第三方工具；source 字段只是"获取途径"记录。
# 人类可读版（含说明与场景匹配）：docs/wasm-anti-rea.md

version: 1
kind: wasm-anti-rea-options
status: guide-only  # 非需求基线，不改变 SRS
note: >-
  WASM 是编译目标，不是源语言。WASM 不能对宿主保密：线性内存与导入函数都在对方手里，
  AOT 缓存仍是机器码。本技能 IR 变换理论上面向 wasm32，但端到端仅在 Linux x86_64 验证过，
  wasm32 属实验性，必须先试点。先做 W1（strip + 优化），高价值核心优先 W0/W5。

# 组合建议（按场景）
combinations:
  - scenario: 所有 WASM 产物
    options: [W1]
  - scenario: 浏览器前端（无服务端核心）
    options: [W1, W6, W8]
  - scenario: 桌面 / 边缘（有宿主）
    options: [W1, W5, W7, W8]
  - scenario: 高价值 WASM 算法
    options: [W1, W2, W3, W4]
  - scenario: 服务化产品
    options: [W0, W1]

options:
  - id: W0
    name: 核心逻辑放服务端/宿主
    principle: 授权/密钥运算/核心算法/风控放服务端或宿主 native；WASM 只做 UI/编排/胶水。
    effect: 逆 WASM 也拿不到核心。
    effectiveness: highest
    pros:
      - 唯一能让"逆 WASM 也没有产出"的路径
      - 不受字节码可读性约束
    cons:
      - 需联网或宿主能力；有延迟与部署成本
      - 离线纯前端场景不可用
    impacts:
      architecture: 最大
      runtime: 网络/宿主调用延迟
      ops: 可用性/SLA 成为新的失败点
      portability: 不变（WASM 变薄）
    tools: []
    best_for: 产品本就有服务端/宿主
    verify: 攻击方视角确认"逆到底得到什么"

  - id: W1
    name: 构建基线（-O3 + strip 自定义段/DWARF + 不发映射）
    principle: 用 -O3/-Oz 优化；wasm-strip 去掉 name/DWARF/sourceMappingURL/producers；不发布 symbols/source map；Web 配 SRI。
    effect: 名字与源码结构消失；反编译仍能得到语义等价伪代码。
    effectiveness: low-medium
    pros:
      - 零成本、显著增加阅读成本
      - 所有 WASM 项目的发布底线
    cons:
      - 不是保护（控制流/字符串/数据段仍在）
      - wasm2c/wasm-decompile 仍可用
      - strip 后崩溃栈难定位
    impacts:
      build: CI 增加 strip/符号归档
      runtime: 优化级别可能改变浮点/边界行为
      ops: 线上排障需私有符号
      portability: 不变
    tools:
      - name: wasm-strip / wasm-objdump（wabt）
        source: https://github.com/WebAssembly/wabt
        license: Apache-2.0
      - name: wasm-opt（Binaryen）
        source: https://github.com/WebAssembly/binaryen
        license: Apache-2.0
    best_for: 所有 WASM 产物；先做 W1
    verify: wasm-objdump -x 确认无 name/DWARF；wasm2wat 看可读性

  - id: W2
    name: IR 变换（本引擎 → wasm32，实验性）
    principle: 源侧 C/C++/Rust(C/FFI) 用 clang --target=wasm32 + 本引擎 LLVM Pass，在生成 WASM 前施加 CFF/MBA/字符串加密等，再 wasm-ld 链接。
    effect: WASM 字节码的控制流/常量结构被改写。
    effectiveness: medium-high
    pros:
      - 复用本引擎已有变换
      - 源侧一次改造可多目标
    cons:
      - 本项目端到端只在 Linux x86_64 验证过，wasm32 需试点
      - WASM 后端限制可能与变换冲突
      - 体积/性能开销需实测；调试困难
    impacts:
      build: 改为 clang wasm32 + 插件 + wasm-ld
      runtime: 取决于变换强度
      ops: CI 增加 wasm 目标与回归；需未变换基线
      portability: 不变（仍是 wasm）
    tools:
      - name: clang/LLVM --target=wasm32
        source: https://llvm.org/
        license: Apache-2.0-with-LLVM-exception
      - name: wasm-ld
        source: https://lld.llvm.org/
        license: Apache-2.0-with-LLVM-exception
      - name: 本技能 protect（试点）
        source: n/a
        license: MIT
    best_for: 能接受实验性、愿意先做 spike 的项目
    verify: 未变换 vs 变换的功能/性能对照；wasm-decompile 重建工时

  - id: W3
    name: 字符串/数据段处理（IR 加密 + 运行期解密）
    principle: IR 层加密字符串常量，运行期轻量解密写入内存；或拆分 data 段、延迟初始化。
    effect: strings 与静态检索失效。
    effectiveness: medium
    pros:
      - 与 W2 同一构建链
      - 对"随手搜字符串"效果明显
    cons:
      - 宿主可读线性内存，运行期解密后仍可 dump
      - 解密例程本身是锚点
      - 初始化开销与内存占用
    impacts:
      build: 源侧 IR 改造
      runtime: 启动/首次调用开销
      ops: 调试与内存分析变难
      portability: 不变
    tools:
      - name: 本技能 string_encrypt（IR 侧）
        source: n/a
        license: MIT
    best_for: W2 试点通过后的子项
    verify: strings 明文比例 + 内存 dump 难度

  - id: W4
    name: 控制流/VM（IR CFF/MBA/VM → wasm，实验性）
    principle: IR 层控制流平坦化、MBA、不透明谓词，或把整数叶子函数转成自定义 VM 解释。
    effect: 控制流图与常量关系被破坏，自动反编译/模式匹配成本上升。
    effectiveness: medium-high
    pros:
      - 本引擎已有实现
      - 对 wasm32 理论上后端无关
      - 可按函数粒度
    cons:
      - wasm32 端到端未验证
      - VM 解释器在 WASM 里运行有额外开销
      - 体积增长；异常/间接调用/尾调用可能冲突
    impacts:
      build: 源侧 IR + 插件
      runtime: 性能/体积回归
      ops: 需要 wasm 运行时功能测试
      portability: 不变
    tools:
      - name: 本技能 cff/mba/vm（试点）
        source: n/a
        license: MIT
    best_for: W2 试点通过且性能可接受的高价值函数
    verify: 反编译/动态跟踪工时 + 性能/体积对比

  - id: W5
    name: 宿主侧 native 下沉（WASI host / Node addon / Electron）
    principle: 核心用 C/C++/Rust 实现为宿主 native 库，WASM 通过导入调用；native 侧用本技能加固。
    effect: 核心不再在 WASM 里，回到 native 战场。
    effectiveness: high
    pros:
      - 防护强度最高
      - 性能好（批量调用）
      - 可复用现有 native 能力
    cons:
      - 破坏纯 WASM 可移植
      - 每平台/架构各编一份
      - 浏览器环境不可用
    impacts:
      build: 构建矩阵与分发变重
      runtime: 导入调用开销（批量化后可忽略）
      ops: 签名/公证覆盖原生库
      portability: 部分（宿主绑定）
    tools:
      - name: WASI
        source: https://wasi.dev/
        license: Apache-2.0
      - name: Node-API / Electron native modules
        source: https://nodejs.org/api/n-api.html
        license: MIT
      - name: Tauri（Rust 核心）
        source: https://tauri.app/
        license: Apache-2.0 / MIT
    best_for: 桌面/服务端/边缘的加密、授权、协议核心
    verify: 用本技能 verify/attack_sim 验证 native 侧；WASM 侧检查是否残留算法

  - id: W6
    name: 分发形态与完整性（SRI/CSP/签名/加密 at rest）
    principle: Web 用 SRI + CSP 限制加载源；宿主校验模块哈希/签名；必要时静态加密、运行期解密后编译。
    effect: 替换/篡改模块、注入恶意 WASM 的门槛上升。
    effectiveness: supporting
    pros:
      - 与 W1 互补
      - 能防 CDN/缓存投毒/本地替换
    cons:
      - 不防逆向（解密后仍在内存）
      - 密钥在宿主侧可被提取
      - 自建加密加载器破坏缓存/流式编译
      - SRI 只保护传输内容
    impacts:
      build: 增加签名/校验步骤
      runtime: 解密/校验开销
      ops: 密钥轮换、缓存策略
      portability: 不变
    tools:
      - name: 浏览器 SRI / CSP
        source: https://developer.mozilla.org/docs/Web/Security/Subresource_Integrity
        license: n/a
      - name: 自研加载器/签名工具
        source: n/a
        license: n/a
    best_for: Web/桌面分发的完整性需求
    verify: 替换/篡改模块的成功率；确认无明文模块落地

  - id: W7
    name: 运行期对抗（宿主校验/心跳/环境）
    principle: 在宿主做完整性校验、环境检测、心跳与降级；WASM 内只保留最小校验钩子。
    effect: 抬高动态调试/替换模块成本（与 W1/W6 协同）。
    effectiveness: supporting
    pros:
      - 宿主能力比 WASM 强
      - 可与服务端联动
    cons:
      - WASM 内几乎没有可靠反调试
      - 宿主检测可被 patch
      - 误杀（CI/无头浏览器/隐私模式）
    impacts:
      build: 需要哈希/签名基线
      runtime: 启动/运行检测开销
      ops: 误杀救济与测试矩阵
      portability: 需逐平台适配
    tools:
      - name: 自研（宿主哈希/环境/心跳）
        source: n/a
        license: n/a
    best_for: 只作为辅助层
    verify: 挂调试器/替换模块的成功率与耗时

  - id: W8
    name: 密钥与信任根 + 水印
    principle: 密钥放服务端/KMS/HSM 或宿主安全存储；WASM 只拿短期令牌；水印用唯一常量/数据段/调用序列。
    effect: 模块被逆也拿不到长期密钥；泄露可追踪。
    effectiveness: supporting
    pros:
      - 让攻击产出不可直接用
      - 水印为维权留证
    cons:
      - WASM 不能对宿主保密
      - 令牌仍可被重放
      - 水印可被移除/伪造
    impacts:
      architecture: 密钥生命周期/轮换
      runtime: 令牌校验开销
      ops: 服务端签发与合规
      portability: 依赖平台能力
    tools:
      - name: 云 KMS/HSM
        source: 各云厂商或硬件厂商
        license: commercial
      - name: 平台安全存储
        source: 平台文档
        license: platform
    best_for: 只要还发密钥到客户端/宿主，就应优先处理
    verify: 客户端/宿主是否残留可用长期密钥

# 验证方法论（WASM 侧）
verification:
  note: >-
    本技能 verify/attack_sim 面向 LLVM 原生产物；W2/W4 的源侧 IR 可用，
    但 wasm32 端到端未验证；W5 的 native 部分照常使用常规链路。
  tools:
    - name: wasm2wat / wasm-objdump
      source: https://github.com/WebAssembly/wabt
      license: Apache-2.0
      use: 反汇编、查看段/名字/导入导出
    - name: wasm-decompile
      source: https://github.com/WebAssembly/wabt
      license: Apache-2.0
      use: 生成类 C 伪代码
    - name: wasm2c
      source: https://github.com/WebAssembly/wabt
      license: Apache-2.0
      use: 转 C 后进入 native 分析链
    - name: wasm-opt
      source: https://github.com/WebAssembly/binaryen
      license: Apache-2.0
      use: 优化/对比（不是混淆器）
    - name: wasm-strip
      source: https://github.com/WebAssembly/wabt
      license: Apache-2.0
      use: 去掉自定义段/DWARF（验证 W1）
    - name: wasm-tools print
      source: https://github.com/bytecodealliance/wasm-tools
      license: Apache-2.0
      use: 打印模块结构
    - name: Ghidra / Binary Ninja / IDA
      source: https://ghidra-sre.org/
      license: Apache-2.0 / commercial
      use: WASM/wasm2c 产物反编译
    - name: strings
      source: 系统 binutils
      license: GPL
      use: 字符串/路径线索
  metrics:
    - 名字可读率（name 段/反编译后）
    - 控制流可读性与重建工时
    - 字符串明文比例
    - 体积/性能相对 -O3 基线的变化
    - 分发链完整性（SRI/签名/缓存）
    - "逆到底得到了什么（可用算法/密钥 = 防护不够）"
  steps:
    - wasm-objdump -x 看段/导入导出，确认无 name/DWARF/sourceMappingURL
    - wasm2wat/wasm-decompile 反汇编，统计名字/控制流可读性
    - strings 统计明文比例（W3 前后对比）
    - wasm2c 转 C，再用 Ghidra/IDA 分析，对比 W2/W4 前后重建工时
    - wasmtime/Node/浏览器跑功能与性能基线（未变换 vs 变换）
    - 检查 SRI/CSP/签名/缓存，确认无 symbols/source map/-g 产物
